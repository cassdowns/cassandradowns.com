<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrapper">
    <main id="content">
        <div class="col-4">
            <h1>Contact</h1>
            <p>For artwork, exhibition, or any other enquiries please fill in the form below.</p>
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="46c0aad7-0069-46a6-952b-19329a7f9103">
                <input type="hidden" name="subject" value="New message from cassandradowns.com">
                <input type="hidden" name="redirect" value="https://cassandradowns.com/thanks.html">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>
    </main>
</div>
<script src="/js/data.js"></script>
<script src="/js/templates.js"></script>
</body>
</html>
